theme: light

server:
  address: "tcp://0.0.0.0:9091"

log:
  level: info

totp:
  disable: true

webauthn:
  disable: true

authentication_backend:
  password_reset:
    disable: true
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2
      argon2:
        variant: argon2id

access_control:
  default_policy: one_factor

session:
  name: authelia_session
  expiration: 1M
  inactivity: 1h
  cookies:
    - domain: "{{ AUTHELIA_PUBLIC_DOMAIN }}"
      authelia_url: "{{ AUTHELIA_PUBLIC_URL }}"
      default_redirection_url: "{{ AUTHELIA_PUBLIC_URL }}/"

storage:
  postgres:
    database: magicboto_authelia

# No outbound email configured (password reset is disabled above, so nothing sends through this)
# — filesystem is the only notifier that needs zero setup.
notifier:
  filesystem:
    filename: /config/notification.txt

identity_providers:
  oidc:
    lifespans:
      access_token: 5m
      id_token: 1h
      refresh_token: 720h # 30 days
    clients:
      - client_id: "magic-boto-claude-connector"
        client_name: "Claude Connector"
        client_secret: "{{ AUTHELIA_CLAUDE_CONNECTOR_CLIENT_SECRET_HASH }}"
        public: false
        token_endpoint_auth_method: client_secret_post
        access_token_signed_response_alg: RS256
        authorization_policy: one_factor
        consent_mode: pre-configured
        redirect_uris:
          - "https://claude.ai/api/mcp/auth_callback"
        scopes:
          - openid
          - profile
          - email
          - offline_access
          - groups
        grant_types:
          - authorization_code
          - refresh_token
        response_types:
          - code
        audience:
          - "magic-boto-tools-api"
        requested_audience_mode: implicit
      - client_id: "magic-boto-muse-connector"
        client_name: "Muse Connector"
        client_secret: "{{ AUTHELIA_MUSE_CONNECTOR_CLIENT_SECRET_HASH }}"
        public: false
        token_endpoint_auth_method: client_secret_post
        access_token_signed_response_alg: RS256
        authorization_policy: one_factor
        consent_mode: pre-configured
        redirect_uris:
          - "https://agent.meta.ai/api/hatch/oauth/callback"
        scopes:
          - openid
          - profile
          - email
          - offline_access
          - groups
        grant_types:
          - authorization_code
          - refresh_token
        response_types:
          - code
        audience:
          - "magic-boto-tools-api"
        requested_audience_mode: implicit
