[project]
name = "magic-boto-agent-api"
version = "0.1.0"
description = "Agent API for magic-boto; OpenAI-compatible chat and tool execution via tools_api."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "async-lru>=2.0.0",
    "fastapi>=0.115.0",
    "sse-starlette>=2.0.0",
    "uvicorn[standard]>=0.32.0",
    "invoke>=2.0.0",
    "pydantic-settings>=2.0.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "loguru>=0.7.0",
    "openapi-pydantic>=0.5.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-invoke>=2.0.0.10",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-invoke>=2.0.0.10",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = [".", "app", "tasks"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
packages = ["app", "tasks"]
