[project]
name = "magic-boto-tools-api"
version = "0.1.0"
description = "Tools API for magic-boto; OpenAPI-described tool endpoints (e.g. card lookup)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.31.0,<0.32",
    "asyncpg-stubs>=0.31.0",
    "alembic>=1.13.0",
    "invoke>=2.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
    "fastapi-pagination>=0.15.11",
    "mcp>=1.2.0",
    "anthropic>=0.40.0",
    "httpx>=0.28.0",
    "celery[redis]>=5.4.0",
    "flower>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "import-linter>=2.0.0",
    "types-invoke>=2.0.0.10",
    "celery-types>=0.22.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "import-linter>=2.0.0",
    "types-invoke>=2.0.0.10",
    "celery-types>=0.22.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = [".", "app", "migrations", "tasks"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

# ORM package: sibling modules and ``Mapped`` string forward refs; allow UP037/F821 to support bi-directional ORM relations.
# Migration versions: long lines are normal in generated Alembic files.
[tool.ruff.lint.per-file-ignores]
"app/models/**/*.py" = ["UP037", "F821"]
"migrations/versions/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
plugins = ["sqlalchemy.ext.mypy.plugin"]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
packages = ["app", "migrations", "tasks"]
exclude = ["migrations/env.py"]
