# Root stack for magic-boto. See docs/PROJECT-PLAN.md for architecture.
services:
  postgres:
    image: postgres:16-alpine
    container_name: magic-boto-tools-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-magicboto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-magicboto}
      POSTGRES_DB: ${POSTGRES_DB:-magicboto}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tools_db_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-magicboto} -d ${POSTGRES_DB:-magicboto}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  tools_api:
    build: ./tools_api
    container_name: magic-boto-tools-api
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      TOOLS_API_PORT: ${TOOLS_API_PORT:-8000}
    ports:
      - "${TOOLS_API_LOCAL_PORT:-8000}:${TOOLS_API_PORT:-8000}"
    volumes:
      - ./tools_api/app:/app/app
    command: [ "sh", "-c", "uv run uvicorn app.cmd.serve_http:app --host 0.0.0.0 --port ${TOOLS_API_PORT:-8000} --reload" ]
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  tools_mcp:
    build: ./tools_api
    container_name: magic-boto-tools-mcp
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      TOOLS_MCP_HOST: ${TOOLS_MCP_HOST:-0.0.0.0}
      TOOLS_MCP_PORT: ${TOOLS_MCP_PORT:-8765}
    ports:
      - "${TOOLS_MCP_LOCAL_PORT:-8765}:${TOOLS_MCP_PORT:-8765}"
    volumes:
      - ./tools_api/app:/app/app
    command:
      [
        "sh",
        "-c",
        "uv run uvicorn app.cmd.serve_mcp.asgi:app --host ${TOOLS_MCP_HOST:-0.0.0.0} --port ${TOOLS_MCP_PORT:-8765} --reload",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; p=os.environ.get('TOOLS_MCP_PORT', '8765'); urllib.request.urlopen(f'http://127.0.0.1:{p}/health')\" || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  # MCP Inspector (debug tools_mcp). UI :6274, proxy :6277 — see README in repo root / AGENTS.md.
  # In the Inspector, use Streamable HTTP URL: http://tools_mcp:8765/mcp (Docker DNS from this network).
  mcp_inspector:
    image: ghcr.io/modelcontextprotocol/inspector:latest
    container_name: magic-boto-mcp-inspector
    restart: unless-stopped
    ports:
      - "${MCP_INSPECTOR_CLIENT_PORT:-6274}:6274"
      - "${MCP_INSPECTOR_SERVER_PORT:-6277}:6277"
    environment:
      HOST: "0.0.0.0"
      MCP_AUTO_OPEN_ENABLED: "false"
    depends_on:
      tools_mcp:
        condition: service_healthy

volumes:
  tools_db_postgres_data:
