# Root stack for magic-boto. See docs/PROJECT-PLAN.md for architecture.
services:
  postgres:
    image: postgres:16-alpine
    container_name: magic-boto-tools-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-magicboto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-magicboto}
      POSTGRES_DB: ${POSTGRES_DB:-magicboto}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tools_db_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-magicboto} -d ${POSTGRES_DB:-magicboto}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  tools_api:
    build: ./tools_api
    container_name: magic-boto-tools-api
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      TOOLS_API_PORT: ${TOOLS_API_PORT:-8000}
    ports:
      - "${TOOLS_API_LOCAL_PORT:-8000}:${TOOLS_API_PORT:-8000}"
    volumes:
      - ./tools_api/app:/app/app
    command: [ "sh", "-c", "uv run uvicorn app.main:app --host 0.0.0.0 --port ${TOOLS_API_PORT:-8000} --reload" ]
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  agent_api:
    build: ./agent_api
    container_name: magic-boto-agent-api
    restart: unless-stopped
    env_file: .env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      AGENT_API_PORT: ${AGENT_API_PORT:-8000}
      TOOLS_API_BASE_URL: http://tools_api:${TOOLS_API_PORT:-8000}
      OPENAI_PROXY_BASE_URL: ${OPENAI_PROXY_BASE_URL:-http://host.docker.internal:1234}
      OPENAI_PROXY_API_KEY: ${OPENAI_PROXY_API_KEY}
      OPENAI_PROXY_MODEL: ${OPENAI_PROXY_MODEL:-default}
    ports:
      - "${AGENT_LOCAL_PORT:-8001}:${AGENT_API_PORT:-8000}"
    volumes:
      - ./agent_api/app:/app/app
      - ./agent_api/settings.py:/app/settings.py
    command: [ "sh", "-c", "uv run uvicorn app.main:app --host 0.0.0.0 --port ${AGENT_API_PORT:-8000} --reload" ]
    depends_on:
      tools_api:
        condition: service_healthy

  ui:
    image: massif01/chatraw:latest
    container_name: magic-boto-ui
    restart: unless-stopped
    ports:
      - "${UI_LOCAL_PORT:-8080}:51111"
    volumes:
      - chatraw_data:/app/data
    environment:
      - PORT=51111
      - DATA_DIR=/app/data
    depends_on:
      - agent_api

volumes:
  tools_db_postgres_data:
  chatraw_data:
