# Root stack for magic-boto. See docs/PROJECT-PLAN.md for architecture.
# Every port below is bound to 127.0.0.1: nothing here is reachable from outside this host.
services:
  postgres:
    build: ./postgres
    container_name: magic-boto-tools-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-magicboto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-magicboto}
      POSTGRES_DB: ${POSTGRES_DB:-magicboto}
      # Creates a sibling magicboto_authelia database in this same instance — see
      # postgres/init-db.sh — same shared-instance pattern Fly uses (postgres/fly.toml).
      AUTHELIA_DB_NAME: ${AUTHELIA_DB_NAME:-magicboto_authelia}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tools_db_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-magicboto} -d ${POSTGRES_DB:-magicboto}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    build: ./redis
    container_name: magic-boto-tools-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_LOCAL_PORT:-6379}:6379"
    volumes:
      - tools_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  tools_api:
    build: ./tools_api
    container_name: magic-boto-tools-api
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      TOOLS_API_PORT: ${TOOLS_API_PORT:-8000}
    ports:
      - "127.0.0.1:${TOOLS_API_LOCAL_PORT:-8000}:${TOOLS_API_PORT:-8000}"
    volumes:
      - ./tools_api/app:/app/app
      - ./tools_api/cache:/app/cache
      - ./tools_api/debug:/app/debug
    command: [ "sh", "-c", "uv run --no-sync uvicorn app.cmd.serve_http:app --host 0.0.0.0 --port ${TOOLS_API_PORT:-8000} --reload" ]
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  tools_celery_worker:
    build: ./tools_api
    container_name: magic-boto-tools-celery
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      CELERY_REDIS_URL: ${CELERY_REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./tools_api/app:/app/app
      - ./tools_api/cache:/app/cache
      - ./tools_api/debug:/app/debug
    command: [ "sh", "-c", "uv run --no-sync celery -A app.cmd.serve_celery:celery_app worker --loglevel=${CELERY_LOG_LEVEL:-INFO}" ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    build: ./tools_api
    container_name: magic-boto-tools-flower
    restart: unless-stopped
    env_file: .env
    environment:
      CELERY_REDIS_URL: ${CELERY_REDIS_URL:-redis://redis:6379/0}
    ports:
      - "127.0.0.1:${FLOWER_LOCAL_PORT:-5555}:${FLOWER_PORT:-5555}"
    command: [ "sh", "-c", "uv run --no-sync celery -A app.cmd.serve_celery:celery_app flower --address=0.0.0.0 --port=${FLOWER_PORT:-5555}" ]
    depends_on:
      redis:
        condition: service_healthy

  tools_mcp:
    build: ./tools_api
    container_name: magic-boto-tools-mcp
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      TOOLS_MCP_HOST: ${TOOLS_MCP_HOST:-0.0.0.0}
      TOOLS_MCP_PORT: ${TOOLS_MCP_PORT:-8765}
      CELERY_REDIS_URL: ${CELERY_REDIS_URL:-redis://redis:6379/0}
      TOOLS_MCP_AUTH_ENABLED: ${TOOLS_MCP_AUTH_ENABLED:-false}
      TOOLS_MCP_RESOURCE_SERVER_URL: ${TOOLS_MCP_RESOURCE_SERVER_URL:-http://localhost:8765}
      TOOLS_MCP_REQUIRED_SCOPES: ${TOOLS_MCP_REQUIRED_SCOPES:-}
      # Must match the issuer clients actually see (they reach Authelia via the host-mapped
      # port); this container reaches Authelia over the compose network instead, hence the
      # separate OIDC_JWKS_URL below.
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://localhost:9091}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://authelia:9091/jwks.json}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-magic-boto-tools-api}
      OIDC_JWKS_CACHE_SECONDS: ${OIDC_JWKS_CACHE_SECONDS:-300}
    ports:
      - "127.0.0.1:${TOOLS_MCP_LOCAL_PORT:-8765}:${TOOLS_MCP_PORT:-8765}"
    volumes:
      - ./tools_api/app:/app/app
    command: [ "sh", "-c", "uv run --no-sync uvicorn app.cmd.serve_mcp.asgi:app --host ${TOOLS_MCP_HOST:-0.0.0.0} --port ${TOOLS_MCP_PORT:-8765} --reload" ]
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import os, urllib.request; p=os.environ.get('TOOLS_MCP_PORT', '8765'); urllib.request.urlopen(f'http://127.0.0.1:{p}/health')\" || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  # Unlike Keycloak, Authelia has no separate admin console/API — the login portal and the OIDC
  # endpoints Claude needs are the same surface, so there's nothing to split into a second proxy
  # service (contrast the old keycloak/keycloak_public_proxy split). State (sessions, OIDC
  # grants) lives in the shared `postgres` service's magicboto_authelia database, not its own
  # container/volume.
  authelia:
    build: ./authelia
    container_name: magic-boto-authelia
    restart: unless-stopped
    env_file: .env
    environment:
      # Real Authelia config sources — its own env-var binding (`AUTHELIA_<PATH>`, `_FILE` suffix
      # for secret-shaped keys), documented Authelia behavior. The `_FILE` ones point at the same
      # paths bind-mounted below.
      AUTHELIA_SESSION_SECRET_FILE: /secrets/session_secret
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /secrets/storage_encryption_key
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE: /secrets/oidc_hmac_secret
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_ISSUER_PRIVATE_KEY_FILE: /secrets/oidc_issuer.pem
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /secrets/reset_password_jwt_secret
      AUTHELIA_STORAGE_POSTGRES_ADDRESS: tcp://postgres:5432
      AUTHELIA_STORAGE_POSTGRES_USERNAME: ${POSTGRES_USER:-magicboto}
      AUTHELIA_STORAGE_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-magicboto}
      # Consumed by docker-entrypoint.sh's template substitution, not Authelia's own config
      # binding.
      AUTHELIA_PUBLIC_DOMAIN: localhost
      AUTHELIA_PUBLIC_URL: http://localhost:${AUTHELIA_LOCAL_PORT:-9091}
    ports:
      - "127.0.0.1:${AUTHELIA_LOCAL_PORT:-9091}:9091"
    volumes:
      - ./authelia/.secrets/oidc-issuer.pem:/secrets/oidc_issuer.pem:ro
      - ./authelia/.secrets/claude-connector-client-secret-hash.txt:/secrets/claude_connector_client_secret_hash:ro
      - ./authelia/.secrets/muse-connector-client-secret-hash.txt:/secrets/muse_connector_client_secret_hash:ro
      - ./authelia/.secrets/admin-password-hash.txt:/secrets/admin_password_hash:ro
      - ./authelia/.secrets/session-secret.txt:/secrets/session_secret:ro
      - ./authelia/.secrets/storage-encryption-key.txt:/secrets/storage_encryption_key:ro
      - ./authelia/.secrets/oidc-hmac-secret.txt:/secrets/oidc_hmac_secret:ro
      - ./authelia/.secrets/reset-password-jwt-secret.txt:/secrets/reset_password_jwt_secret:ro
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1:9091/api/health" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  # MCP Inspector (debug tools_mcp). UI :6274, proxy :6277 — see README in repo root / AGENTS.md.
  # In the Inspector, use Streamable HTTP URL: http://tools_mcp:8765/mcp (Docker DNS from this network).
  # entry point fixes https://github.com/modelcontextprotocol/inspector/issues/1082
  # can be removed after latest pulls later than 3/7
  mcp_inspector:
    image: ghcr.io/modelcontextprotocol/inspector:latest
    container_name: magic-boto-mcp-inspector
    restart: unless-stopped
    entrypoint: [ "/bin/sh", "-c", "mkdir -p /app/server/static && cp /app/server/build/static/sandbox_proxy.html /app/server/static/ && exec npm start" ]
    ports:
      - "127.0.0.1:${MCP_INSPECTOR_CLIENT_PORT:-6274}:6274"
      - "127.0.0.1:${MCP_INSPECTOR_SERVER_PORT:-6277}:6277"
    environment:
      HOST: "0.0.0.0"
      MCP_AUTO_OPEN_ENABLED: "false"
    depends_on:
      tools_mcp:
        condition: service_healthy

volumes:
  tools_db_postgres_data:
  tools_redis_data:
