# Public-host overlay (Lightsail etc). Run alongside the base file, never alone:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Moves Keycloak off `start-dev` into production mode, hostname-aware for its public subdomain.
# Ingress is the `nginx` service below — see docs/LIGHTSAIL-DEPLOY.md and
# deploy/lightsail/nginx/. It reaches every backend by compose service name over the Docker
# network, not via the 127.0.0.1-bound host ports in docker-compose.yml (those stay for local
# host-side convenience — DBeaver, MCP Inspector, etc. — and are orthogonal to this).
#
# Memory tuning lives here, not in the base file, because it's a 512MB-instance concession, not
# something local dev needs. Postgres's stock shared_buffers is 128MB *per instance*, so it's
# tuned down hard for what's genuinely a low-traffic personal deployment. Keycloak's JVM gets an
# explicit -Xmx instead of letting Quarkus guess. mem_limit on every service is a backstop, not
# the primary fix: if this tuning is still wrong somewhere, one container gets OOM-killed and
# restarts instead of the whole box freezing again. Even with all of this, expect the instance to
# lean on swap sometimes (see lightsail/install.sh) rather than have comfortable headroom —
# that's the honest tradeoff of fitting this stack in 512MB.
#
# keycloak_postgres from the base file is unused here on purpose (never in bootstrap.sh's started
# service list) — Keycloak gets its own database inside the shared `postgres` instance instead
# (deploy/lightsail/postgres/init-keycloak-db.sh), not a second Postgres container. That's the
# single biggest memory win available short of shrinking the JVM itself: a whole second Postgres
# process (even tuned) costs more than the database it'd be holding ever will on this box. Local
# dev keeps the two-container split (docker-compose.yml, untouched) since it isn't memory-
# constrained and there's no reason to complicate it.
services:
  postgres:
    command: postgres -c shared_buffers=32MB -c max_connections=30 -c work_mem=4MB
    environment:
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
    volumes:
      - ./deploy/lightsail/postgres/init-keycloak-db.sh:/docker-entrypoint-initdb.d/init-keycloak-db.sh:ro
    mem_limit: 96m

  redis:
    mem_limit: 32m

  tools_mcp:
    mem_limit: 150m

  tools_celery_worker:
    mem_limit: 150m

  flower:
    mem_limit: 64m

  keycloak_public_proxy:
    mem_limit: 32m

  keycloak:
    command: start --import-realm
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-magicboto}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-magicboto}
      # An explicit https:// URL is what Keycloak's hostname-v2 provider needs to know it's
      # externally HTTPS despite terminating plain HTTP from nginx internally (KC_PROXY_HEADERS
      # in docker-compose.yml already tells it to trust nginx's X-Forwarded-*). This is the
      # public proxy's domain (KEYCLOAK_DOMAIN), not the admin one — that's what ends up in the
      # `iss` claim clients see.
      KC_HOSTNAME: https://${KEYCLOAK_DOMAIN}
      KC_HOSTNAME_STRICT: "true"
      # Explicit heap cap — the single biggest consumer on this box otherwise. Low enough to
      # leave room for everything else, low enough that GC will work harder than on a bigger
      # instance, which is an acceptable trade for a low-traffic personal realm.
      JAVA_OPTS_APPEND: "-Xms64m -Xmx224m"
    # Fully replaces (not merges with) the base file's depends_on: keycloak_postgres — Keycloak
    # depends on the shared `postgres` instance here instead. Without !override this would MERGE
    # and Compose would still start keycloak_postgres just to satisfy the old dependency, which is
    # exactly the extra Postgres process this overlay exists to avoid.
    depends_on: !override
      postgres:
        condition: service_healthy
    mem_limit: 300m

  # Ingress: reverse-proxies the four magicboto-*.<domain> subdomains and the Postgres TCP
  # passthrough. Config is rendered from deploy/lightsail/nginx/templates/nginx.conf.template at
  # container start (render-and-run.sh, envsubst) — recreating this container (a normal `docker
  # compose up -d`, which bootstrap.sh always does) picks up any domain/IP/port change baked into
  # its environment below. See docs/LIGHTSAIL-DEPLOY.md for the certbot/cert-bootstrap side of
  # this — nginx won't even start until something real or placeholder exists at the
  # ssl_certificate paths the template references.
  nginx:
    image: nginx:1.27-alpine
    container_name: magic-boto-nginx
    restart: unless-stopped
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN}
      KEYCLOAK_DOMAIN: ${KEYCLOAK_DOMAIN}
      KEYCLOAK_ADMIN_DOMAIN: ${KEYCLOAK_ADMIN_DOMAIN}
      FLOWER_DOMAIN: ${FLOWER_DOMAIN}
      ADMIN_ALLOWED_IP: ${ADMIN_ALLOWED_IP}
      POSTGRES_PUBLIC_PORT: ${POSTGRES_PUBLIC_PORT:-55432}
    entrypoint: [ "/bin/sh", "/docker-entrypoint.d/render-and-run.sh" ]
    volumes:
      - ./deploy/lightsail/nginx/templates:/etc/nginx/templates:ro
      - ./deploy/lightsail/nginx/render-and-run.sh:/docker-entrypoint.d/render-and-run.sh:ro
      # Host-managed certs (certbot, native — see bootstrap.sh) and the ACME webroot it and this
      # container both need to agree on. Real host paths, not repo-relative: certs shouldn't live
      # in a git-tracked directory.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
      - "${POSTGRES_PUBLIC_PORT:-55432}:${POSTGRES_PUBLIC_PORT:-55432}"
    mem_limit: 32m
    # service_started, not service_healthy, everywhere here on purpose: this only needs to
    # guarantee each backend container exists and is network-attached before nginx starts, so its
    # static `proxy_pass http://tools_mcp:8765`-style config resolves at startup instead of
    # nginx refusing to start on "host not found in upstream". It deliberately does NOT wait for
    # full app-level health (DB migrations done, Keycloak's JVM warmed up, etc.) — that would
    # block every route through nginx, including ones to backends that are already healthy, on
    # whichever single backend is slowest. A route to a not-yet-healthy backend just 502s until
    # it catches up, instead of every route stalling for all of them.
    depends_on:
      tools_mcp:
        condition: service_started
      keycloak_public_proxy:
        condition: service_started
      keycloak:
        condition: service_started
      flower:
        condition: service_started
      postgres:
        condition: service_started
