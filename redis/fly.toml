# Fly.io app for the magic-boto Redis backend (Celery broker/results) — a single Machine +
# volume, no managed Redis cluster. Private-network only: just a private Flycast IP (allocated by
# deploy.ps1), so this is reachable only from other apps in the same Fly org via
# <app>.flycast:6379, never the public internet. Clients must use .flycast, not .internal: only
# traffic through Fly's proxy auto-starts the Machine after it's stopped (e.g. host maintenance).
#
# `app` below is a placeholder — Fly app names are globally unique. deploy.ps1 passes -a
# explicitly so the -AppName param is what actually matters; edit this only if you run `fly`
# commands by hand against this config.
app = "magic-boto-redis"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[[mounts]]
  source = "magic_boto_redis_data"
  destination = "/data"

[[services]]
  internal_port = 6379
  protocol = "tcp"
  auto_start_machines = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [[services.ports]]
    port = 6379

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
